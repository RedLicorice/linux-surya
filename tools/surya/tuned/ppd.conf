# tuned-ppd: GNOME's power mode switch (the power-profiles-daemon D-Bus API) mapped to the surya
# profiles. Installed as tuned's ppd.conf by install.sh.
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=false

[profiles]
power-saver=surya-powersave
balanced=surya-balanced
performance=surya-performance

[battery]
balanced=surya-balanced-battery
