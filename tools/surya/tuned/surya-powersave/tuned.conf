# POCO X3 NFC (SM7150): little A55 = policy0 (cpus 0-5, 300 MHz - 1.8 GHz),
# big A76 = policy6 (cpus 6-7, 300 MHz - 2.3 GHz). schedutil and EAS pick the frequency and the
# cluster; these profiles only move the ceilings. Values are steps of scaling_available_frequencies.
#
# GNOME switches here on low battery (power-saver-profile-on-low-battery). 1.84 GHz on the big
# cluster becomes the boost level once the boost helper exists; normal use stays at these caps.
[main]
summary=POCO X3 NFC power saver (low battery): both clusters capped

[cpu]
governor=schedutil

[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1497600
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=1555200
